name: UTAWAKU LIVE (native) build

on:
  push:
    paths:
      - 'utawaku-live/native/**'
      - '.github/workflows/utawaku-native.yml'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-24.04
            name: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: utawaku-live/native
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxcomposite-dev libxext-dev libgl1-mesa-dev ninja-build

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -S . -B build -A x64
          elif [ "$RUNNER_OS" = "macOS" ]; then
            cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          else
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test (DSP / VST3 hosting / engine)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "build/UtawakuLive_artefacts/Release/UTAWAKU LIVE.exe" dist/
          elif [ "$RUNNER_OS" = "macOS" ]; then
            ditto -c -k --keepParent "build/UtawakuLive_artefacts/Release/UTAWAKU LIVE.app" "dist/UTAWAKU-LIVE-macOS.zip"
          else
            cp "build/UtawakuLive_artefacts/Release/UTAWAKU LIVE" dist/
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: utawaku-live-${{ matrix.name }}
          path: utawaku-live/native/dist/
